<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSeF PDF — generator faktur</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <header id="action-bar">
      <a
        id="github-link"
        href="https://github.com/Patras3/ksef-pdf"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
        title="GitHub"
      >
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1-.02-1.97-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.97.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.78 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.25 5.68.41.35.78 1.05.78 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.68.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"
          />
        </svg>
      </a>
      <aside id="contact-info">
        Potrzebujesz dedykowanej wizualizacji? Napisz na
        <a
          id="contact-email"
          href="#"
          data-user="patrykdadas+ksef"
          data-domain="gmail.com"
          ><noscript>[włącz JavaScript, aby zobaczyć adres]</noscript></a
        >
        — wystawiam faktury VAT.
      </aside>
      <div class="action-bar-buttons">
        <button data-action="reset" type="button" class="reset-btn" hidden>
          Wczytaj inny plik
        </button>
        <button data-action="pdf" type="button" class="pdf-btn" hidden>
          Pobierz PDF
        </button>
      </div>
    </header>

    <div id="upload-panel">
      <h1>Generator PDF z faktury KSeF</h1>
      <p class="subtitle">
        Wczytaj plik XML faktury (FA(3)). Dane zostają w Twojej przeglądarce — nic nie jest wysyłane na serwer.
      </p>

      <div class="form-row">
        <label for="xml-file">Plik XML faktury:</label>
        <input id="xml-file" type="file" accept=".xml,application/xml,text/xml" />
      </div>

      <div class="form-row">
        <label for="ksef-id">Numer KSeF:</label>
        <input
          id="ksef-id"
          type="text"
          placeholder="np. 1111111111-20260421-AB12CD34EF56-01"
          autocomplete="off"
        />
        <div class="hint">
          Wstawi się automatycznie, jeśli nazwa pliku ma format
          <code>NIP-YYYYMMDD-XXXXXXXXXXXX-NN</code>.
        </div>
      </div>

      <div id="status-msg" class="status-msg" hidden></div>

      <div class="form-actions" id="form-actions" hidden>
        <button id="generate-btn" type="button" class="primary">Generuj fakturę</button>
        <button id="skip-ksef-btn" type="button" class="secondary">
          Generuj bez numeru KSeF
        </button>
      </div>
    </div>

    <div id="invoice-root" hidden></div>

    <div id="floating-actions" hidden>
      <button data-action="reset" type="button" class="reset-btn">Wczytaj inny plik</button>
      <button data-action="pdf" type="button" class="pdf-btn">Pobierz PDF</button>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
